<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[오늘부터 레벨업] : 생명과학1 오답노트</title>
    
    <script src="db/database.js"></script>

    <style>
        /* =========================================
           1. 웹 화면 기본 디자인
           ========================================= */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f5; color: #1b4332; margin: 0; padding: 40px 10vw; display: flex; flex-direction: column; align-items: center; }
        .web-main-title { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 0 0 30px 0; color: #081c15; border-bottom: 3px solid #1b4332; padding-bottom: 16px; text-align: center; width: 100%; max-width: 900px; }
        
        #worksheet-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 40px; margin-bottom: 20px; }
        .a4-page { width: 100%; display: flex; flex-direction: column; }
        .a4-grid { width: 100%; display: flex; flex-direction: column; gap: 40px; }
        
        .print-only-title { display: none; }
        .question-page { background-color: #ffffff; border: 1px solid #b7c4bd; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .q-header { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .tag-original { background-color: #d35400; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .tag-similar { background-color: #1b4332; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .q-info { font-size: 14px; font-weight: 700; color: #1b4332; line-height: 1.4; }
        
        .q-image-placeholder { 
            width: 100%; height: auto; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; margin-bottom: 20px; 
            overflow: hidden; background-color: #ffffff;
            padding: 8px; 
            box-sizing: border-box; 
        }
        .real-q-image { width: 100%; height: auto; display: block; }

        .answer-section { display: flex; align-items: center; gap: 15px; }
        .answer-btn { background-color: #f1f3f5; color: #495057; border: 1px solid #dee2e6; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .answer-text { font-size: 16px; font-weight: 400; color: #d35400; display: none; }
        
        .print-area { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 600px; margin-top: 20px; }
        .action-btn-group { display: flex; justify-content: center; gap: 12px; width: 100%; }
        .btn-secondary { background-color: #f1f3f5; color: #495057; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px 20px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary:hover { background-color: #e2e6ea; }
        .btn-primary { background-color: #081c15; color: #ffffff; border: none; border-radius: 8px; padding: 16px 30px; font-size: 16px; font-weight: 600; cursor: pointer; flex: 1; }
        .print-guide-text { font-size: 13px; color: #888; text-align: center; margin-top: 5px; line-height: 1.5; }
        .empty-state { text-align: center; font-size: 16px; color: #1b4332; padding: 60px 20px; font-weight: 600; }

        .spacer { display: none; }

        /* 정답표 웹 화면 구조 */
        .ans-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; line-height: 1.5; word-break: keep-all; }
        .ans-table th, .ans-table td { border: 1px solid #b7c4bd; padding: 12px 10px; text-align: center; vertical-align: middle; }
        .ans-table th { background-color: #f4f7f5; color: #1b4332; font-weight: 700; font-size: 13px; }
        .ans-highlight { font-weight: 800; color: #d35400; font-size: 16px; }
        .detail-box { text-align: left; margin-bottom: 6px; }
        .detail-title { font-weight: 700; color: #1b4332; margin-right: 4px; }

        .web-hide { display: table-row; }

        /* 웹 화면에서는 정답표 페이지가 절대 보이지 않게 숨김 처리 */
        @media screen {
            .print-only-answer-page { display: none !important; }
        }

        /* =========================================
           2. PDF 인쇄 화면 (맥북 최적화 + 아이패드 버그 차단)
           ========================================= */
        @media print {
            @page { size: A4; margin: 0 !important; }
            
            body { background-color: #ffffff; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print, .web-main-title, .print-area { display: none !important; }
            
            #worksheet-container { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }

            /* 🌟 문제 페이지: max-width 100%를 추가하여 아이패드에서 가로가 삐져나가 빈 페이지가 생기는 현상 원천 차단 */
            .a4-page {
                width: 210mm !important; 
                max-width: 100% !important; 
                height: 296mm !important; 
                padding: 20mm 15mm 15mm 15mm !important; 
                box-sizing: border-box !important; 
                page-break-inside: avoid !important; 
                page-break-after: always !important; 
                break-after: page !important;
                display: flex !important; 
                flex-direction: column !important; 
                background-color: #ffffff !important;
                overflow: hidden !important; 
            }

            /* 🌟 맨 마지막 장이 쓸데없이 다음 빈 페이지를 밀어내지 않도록 강제 방어 */
            #worksheet-container > div:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            
            .print-only-title { 
                display: block !important; font-size: 16pt; font-weight: 800; color: #000; 
                border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 0 !important; text-align: left;
            }

            .a4-grid {
                display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 16mm !important; 
                width: 100% !important; flex: 1 !important; position: relative !important; padding-top: 4mm !important; 
            }

            .a4-grid::after {
                content: "" !important; position: absolute !important; top: 0 !important; bottom: 0 !important;
                left: 50% !important; width: 0.5pt !important; background-color: #cccccc !important; transform: translateX(-50%) !important;
            }

            .question-page { border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; height: 100% !important; display: flex !important; flex-direction: column !important; }
            .spacer { display: flex !important; }
            .q-image-placeholder { border: 1px solid #dddddd !important; padding: 8px !important; border-radius: 4px !important; max-height: 175mm !important; overflow: hidden !important; }
            .real-q-image { max-height: 100% !important; object-fit: contain !important; }

            /* 🌟 정답표 전용 페이지 (자연스럽게 여러 장으로 넘어감) */
            .print-only-answer-page { 
                display: block !important; 
                width: 210mm !important;
                max-width: 100% !important;
                height: auto !important; 
                padding: 0mm 15mm 0mm 15mm !important; 
                box-sizing: border-box !important;
                overflow: visible !important; 
                page-break-inside: auto !important; 
            }

            .print-only-answer-page .ans-table {
                display: table !important; 
                margin-top: 0 !important; 
                width: 100% !important;
                border-collapse: collapse !important;
            }

            .print-only-answer-page tbody { display: table-row-group !important; }

            /* 🌟 맥북에서 완벽했던 그 구조 복원: 타이틀 반복을 위한 thead 설정 */
            .print-only-answer-page thead { display: table-header-group !important; }
            .print-only-ans-title-cell {
                padding: 20mm 0mm 8px 0mm !important; 
                border: none !important; text-align: left !important; background-color: #ffffff !important;
            }
            .print-only-ans-title-cell .title-text {
                display: block !important; font-size: 16pt !important; font-weight: 800 !important;
                color: #000 !important; border-bottom: 2px solid #000 !important; padding-bottom: 8px !important;
                margin-bottom: 10px !important;
            }

            /* 🌟 맥북에서 완벽했던 하단 여백: tfoot 활용 */
            .print-only-answer-page tfoot { display: table-footer-group !important; }
            .print-only-ans-footer-cell {
                padding: 0 !important; border: none !important; height: 15mm !important; background-color: transparent !important;
            }

            /* 🌟 표 찢어짐 완벽 방어 */
            .ans-table tr, .ans-table td, .ans-table th { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important; 
            }
            .detail-box {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>

    <h1 class="web-main-title">[오늘부터 레벨업] : 생명과학1 오답노트</h1>
    
    <div id="worksheet-container"></div>

    <div class="print-area no-print">
        <div class="action-btn-group">
            <button class="btn-secondary" onclick="location.href='index.html'">처음으로</button>
            <button class="btn-secondary" onclick="location.href='step3.html'">이전으로</button>
            <button class="btn-primary" onclick="window.print()">PDF 저장 및 인쇄하기</button>
        </div>
        <div class="print-guide-text">인쇄 설정에서 <b>'배경 그래픽'을 체크</b>하고 인쇄 또는 저장하세요.<br>※ 인쇄 시에만 마지막 페이지에 상세 정답 해설표가 자동 첨부됩니다.</div>
    </div>

    <script>
        function formatExamInfo(rawName) {
            const match = rawName.match(/(\d{4}).*?(\d{1,2})월/);
            if (!match) return { ui: rawName, folder: rawName.replace(/ /g, "_") };
            const year = match[1];
            const month = parseInt(match[2]);
            const monthStr = month < 10 ? '0' + month : '' + month;
            const org = [6, 9, 11].includes(month) ? "평가원" : "교육청";
            return { ui: `${year}년 ${month}월 ${org}`, folder: `${year}년_${monthStr}월_${org}` };
        }

        function buildDetailHtml(intent, analysis, exp) {
            let html = "";
            if (intent && intent !== "nan") html += `<div class="detail-box"><span class="detail-title">[출제 의도]</span> ${intent}</div>`;
            if (analysis && analysis !== "nan") html += `<div class="detail-box"><span class="detail-title">[문항 설명]</span> ${analysis}</div>`;
            if (exp && exp !== "nan") html += `<div class="detail-box" style="margin-bottom:0;"><span class="detail-title">[정답 해설]</span> ${exp}</div>`;
            
            if (html === "") {
                html = "<span style='color:#888;'>□ 스스로 핵심 개념 및 오답 이유를 메모해 보세요.</span>";
            }
            return html;
        }

        function loadWorksheet() {
            const rawExamName = localStorage.getItem("selectedExam") || "";
            const examDetails = formatExamInfo(rawExamName);
            const selectedErrorsRaw = localStorage.getItem("selectedErrors");
            const finalSelectionsRaw = localStorage.getItem("finalSelections");
            const container = document.getElementById("worksheet-container");

            if (!selectedErrorsRaw || !finalSelectionsRaw || JSON.parse(finalSelectionsRaw).length === 0) {
                container.innerHTML = "<div class='empty-state'>선택된 문제가 없습니다. 이전 단계에서 문제를 선택해 주세요.</div>";
                return;
            }

            const selectedErrors = JSON.parse(selectedErrorsRaw);
            const finalSelections = JSON.parse(finalSelectionsRaw);
            container.innerHTML = ""; 

            const currentExamData = examDB[examDetails.folder] || examDB[examDetails.ui] || {};

            let itemsInCurrentPage = 0;
            let currentGrid = null;
            let answerTableRows = "";

            function getOrCreateGrid() {
                if (itemsInCurrentPage === 0 || itemsInCurrentPage >= 2) {
                    const page = document.createElement('div');
                    page.className = 'a4-page';
                    
                    const title = document.createElement('div');
                    title.className = 'print-only-title';
                    title.innerText = '[오늘부터 레벨업] : 생명과학1 맞춤형 오답 클리닉';
                    page.appendChild(title);
                    
                    currentGrid = document.createElement('div');
                    currentGrid.className = 'a4-grid';
                    page.appendChild(currentGrid);
                    
                    container.appendChild(page);
                    itemsInCurrentPage = 0;
                }
                return currentGrid;
            }

            selectedErrors.forEach(errorNum => {
                const paddedNum = String(errorNum).padStart(2, '0');
                let data = currentExamData[errorNum];
                if (!data) return;

                if (itemsInCurrentPage === 1) {
                    const spacer = document.createElement("div");
                    spacer.className = "question-page spacer";
                    getOrCreateGrid().appendChild(spacer);
                    itemsInCurrentPage++;
                }

                const origPath = `images_raw/${examDetails.folder}/${paddedNum}.webp`;
                const origInfo = `${examDetails.ui} - ${errorNum}번`;
                const origAns = data.original.ans || "미정";
                
                getOrCreateGrid().appendChild(createQuestionPage("original", origInfo, origAns, origPath));
                itemsInCurrentPage++;

                const origDetails = buildDetailHtml(data.original.core_intent, data.original.data_analysis, data.original.explanation);
                
                answerTableRows += `
                    <tr>
                        <td style="font-weight:bold; color:#d35400;">원본</td>
                        <td style="text-align:left;">${origInfo}</td>
                        <td><span class="ans-highlight">${origAns}</span></td>
                        <td style="text-align:left; vertical-align:top;">${origDetails}</td>
                    </tr>
                `;

                if (data.similars) {
                    data.similars.forEach(sim => {
                        if (finalSelections.includes(sim.id)) {
                            const simDetails = formatExamInfo(sim.simExamName);
                            const simPath = `images_raw/${simDetails.folder}/${sim.imgFile}`;
                            const simInfo = `${simDetails.ui} - ${parseInt(sim.imgFile)}번`;
                            const simAns = sim.ans || "미정";
                            
                            getOrCreateGrid().appendChild(createQuestionPage("similar", simInfo, simAns, simPath));
                            itemsInCurrentPage++;

                            const simDetailsHtml = buildDetailHtml(sim.core_intent, sim.data_analysis, sim.explanation);

                            answerTableRows += `
                                <tr>
                                    <td style="font-weight:bold; color:#1b4332;">유사</td>
                                    <td style="text-align:left;">${simInfo}</td>
                                    <td><span class="ans-highlight">${simAns}</span></td>
                                    <td style="text-align:left; vertical-align:top;">${simDetailsHtml}</td>
                                </tr>
                            `;
                        }
                    });
                }
            });

            if (answerTableRows !== "") {
                const ansPage = document.createElement('div');
                ansPage.className = 'print-only-answer-page'; 

                const tableWrapper = document.createElement('div');
                tableWrapper.style.width = '100%';
                
                /* 🌟 맥북에서 완벽하게 작동했던 thead(타이틀 복제)와 tfoot(하단 여백) 구조를 그대로 복원했습니다. */
                tableWrapper.innerHTML = `
                    <table class="ans-table">
                        <thead>
                            <tr class="web-hide">
                                <th colspan="4" class="print-only-ans-title-cell">
                                    <span class="title-text">[오늘부터 레벨업] : 생명과학1 상세 정답 및 해설-테테테</span>
                                </th>
                            </tr>
                            <tr>
                                <th style="width: 8%;">구분</th>
                                <th style="width: 22%;">문항 정보</th>
                                <th style="width: 10%;">정답</th>
                                <th style="width: 60%;">상세 해설 및 출제 분석</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${answerTableRows}
                        </tbody>
                        <tfoot class="web-hide">
                            <tr>
                                <td colspan="4" class="print-only-ans-footer-cell"></td>
                            </tr>
                        </tfoot>
                    </table>
                `;
                ansPage.appendChild(tableWrapper);
                container.appendChild(ansPage);
            }
        }

        function createQuestionPage(type, info, ansText, imagePath) {
            const pageDiv = document.createElement("div");
            pageDiv.className = "question-page";
            const tagClass = (type === "original") ? "tag-original" : "tag-similar";
            const tagText = (type === "original") ? "오답 문항" : "추천 유사 문항";

            pageDiv.innerHTML = `
                <div class="q-header">
                    <span class="${tagClass}">${tagText}</span>
                    <span class="q-info">${info}</span>
                </div>
                <div class="q-image-placeholder">
                    <img src="${imagePath}" class="real-q-image" onerror="this.onerror=null; this.src=''; this.alt='[이미지 없음]'; this.style.padding='40px';">
                </div>
                <div class="answer-section no-print">
                    <button class="answer-btn" onclick="toggleAnswer(this)">정답 확인</button>
                    <span class="answer-text">정답: ${ansText}</span>
                </div>
            `;
            return pageDiv;
        }

        function toggleAnswer(btn) {
            const answerText = btn.nextElementSibling;
            const isVisible = answerText.style.display === "inline-block";
            answerText.style.display = isVisible ? "none" : "inline-block";
            btn.innerText = isVisible ? "정답 숨기기" : "정답 확인";
        }

        window.onload = loadWorksheet;
    </script>
</body>
</html>
